[workspace]
resolver = "3"
members = [
  "crates/engine",
  "crates/app",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Jaret Varn"]
repository = "https://github.com/jav76/git-oxide"

[workspace.dependencies]
anyhow = "1.0"
bincode = { version = "2.0", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5"
directories = "6.0"
env_logger = "0.11"
gix = { version = "0.70", default-features = false, features = [
  "max-performance-safe",
  "blame",
  "blob-diff",
  "revision",
  "index",
] }
imara-diff = "0.1"
log = "0.4"
plotters = { version = "0.3", default-features = false, features = [
  "bitmap_backend",
  "area_series",
  "line_series",
  "ab_glyph",
] }
rayon = "1.10"
redb = "2.4"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
slint = "1.10"
slint-build = "1.10"
tempfile = "3.15"
thiserror = "2.0"
tokei = "12.1"
tree-sitter = "0.24"
tree-sitter-bash = "0.23"
tree-sitter-c = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.23"
tree-sitter-go = "0.23"
tree-sitter-highlight = "0.24"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-md = "0.3"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
git-oxide-engine = { path = "crates/engine" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Unsafe and FFI hygiene.
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
missing_safety_doc = "warn"
mem_forget = "warn"

# Leftovers that must not ship.
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
unimplemented = "warn"
exit = "warn"
rc_buffer = "warn"
str_to_string = "warn"
empty_structs_with_brackets = "warn"
semicolon_if_nothing_returned = "warn"

# House style explicitly annotates types on non-obvious `let` bindings.
redundant_type_annotations = "allow"

# Numeric casts at UI/chart/timestamp boundaries are routine; use `try_from` where overflow is possible.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

# Pedantic lints with more noise than value for an application.
doc_markdown = "allow"
if_not_else = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_raw_string_hashes = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
